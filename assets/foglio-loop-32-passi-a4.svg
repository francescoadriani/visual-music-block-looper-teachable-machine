  <text x="36" y="33" font-family="sans-serif" font-size="4">Blocco 1 - passi 1-16</text>
  <text x="36" y="105" font-family="sans-serif" font-size="4">Blocco 2 - passi 17-32</text>
  <text x="36" y="186" font-family="sans-serif" font-size="4">Disegna un simbolo per casella. Lascia in bianco le pause.</text>
  <text x="36" y="193" font-family="sans-serif" font-size="4">Inquadra tutti e quattro i marcatori. Ogni casella dura un sedicesimo.</text>
